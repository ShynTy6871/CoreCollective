name: Import RealSatisfied Reviews

on:
  schedule:
    # Monday 9:00 AM US Eastern Daylight Time (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-realsatisfied:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import RealSatisfied reviews
        run: node scripts/fetch-realsatisfied.js

      - name: Commit and push testimonials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/testimonials.json
          if git diff --staged --quiet; then
            echo "No testimonials.json changes to commit."
          else
            git commit -m "Import new RealSatisfied reviews."
            git push
          fi
