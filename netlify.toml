[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/listing/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/event/*"
  to = "/event.html"
  status = 200

[[redirects]]
  from = "/agent/*"
  to = "/agent.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events.html"
  status = 200

[[redirects]]
  from = "/sign/*"
  to = "/sign.html"
  status = 200

[[redirects]]
  from = "/lot/*"
  to = "/lot.html"
  status = 200

