backend:
  name: git-gateway
  branch: main

# Enable Netlify Identity + Git Gateway on your Netlify site dashboard.
# For local editing: npx decap-server

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://corecollectivere.com
display_url: https://corecollectivere.com
logo_url: https://corecollectivere.com/images/uploads/logo.png

collections:
  - name: agents
    label: Agents
    files:
      - label: Agent Profiles
        name: agents
        file: content/agents.json
        description: Edit team member bios, contact info, and headshots.
        fields:
          - label: Agents
            name: agents
            label_singular: Agent
            widget: list
            summary: "{{fields.name}} — {{fields.title}}"
            fields:
              - { label: Agent Route ID, name: agent_id, widget: string, hint: "⚠️ Do not change this after an agent is created — it controls their Schedule Consultation routing. Only set this once, when adding a brand-new agent, using lowercase-with-dashes (e.g. john-smith)." }
              - { label: Full Name, name: name, widget: string, hint: "How it appears everywhere on the site — spotlight card, bio popup, and the agent matcher." }
              - { label: Initials, name: initials, widget: string, hint: "2–3 letters shown when no headshot is uploaded" }
              - { label: Title / Role, name: title, widget: string, hint: "e.g. \"Realtor\" or \"Realtor, Team Lead\" — shown right under your name." }
              - { label: "NC License Number", name: "license", widget: "string", hint: "Numbers only, no # symbol. This shows on your spotlight card and full bio for compliance." }
              - { label: Bio, name: bio, widget: text, hint: "Shown in your full bio popup when someone clicks your card. A few sentences works well." }
              - label: Focus Tags
                name: focus_tags
                widget: list
                field: { label: Tag, name: tag, widget: string }
                hint: "Short keyword tags — a quick-scan summary of what you focus on."
              - label: Headshot Image
                name: headshot
                widget: image
                required: false
                media_folder: "/images/agents"
                public_folder: "/images/agents"
                hint: "Square photo works best (400×400px or larger) — it will be cropped into a circle."
              - { label: Phone, name: phone, widget: string, required: false, hint: "Shown on your bio and used for the click-to-call button." }
              - { label: Email, name: email, widget: string, required: false }
              - label: Default Consultation Type
                name: interest
                widget: select
                options: ["Seller", "Buyer", "Investor"]
                default: Buyer
                hint: "Pre-fills the contact form when someone clicks \"Schedule with You\" from your card."
              - label: "Specialties"
                name: "specialties"
                widget: "select"
                multiple: true
                required: false
                hint: "Shown as tags on your card, and used to match you to visitors in the Find Your Agent quiz. Pick as many as genuinely apply."
                options:
                  - "First-Time Buyers"
                  - "Luxury / Move-Up Homes"
                  - "Investment Properties"
                  - "Military & PCS Relocation"
                  - "New Construction"
                  - "Relocation"
                  - "Listing / Seller Strategy"
                  - "Down Payment Assistance / Grants"
              - label: "Working Style"
                name: "traits"
                widget: "select"
                multiple: true
                required: false
                hint: "How you describe your approach with clients — also used in the Find Your Agent quiz matching."
                options:
                  - "Fast-moving & decisive"
                  - "Warm & patient"
                  - "Highly communicative"
                  - "Detail-oriented & analytical"
                  - "Strategic negotiator"
                  - "Calm under pressure"
                  - "Community-connected"
                  - "Educator at heart"

  - name: neighborhoods
    label: Neighborhood Cards
    files:
      - label: Triangle Neighborhoods
        name: neighborhoods
        file: content/neighborhoods.json
        description: Edit Explore The Triangle grid cards.
        fields:
          - label: Neighborhoods
            name: neighborhoods
            label_singular: Neighborhood
            widget: list
            summary: "{{fields.name}} — {{fields.median_price}}"
            fields:
              - { label: Neighborhood Name, name: name, widget: string }
              - { label: Median Price, name: median_price, widget: string, hint: "e.g. $625K" }
              - { label: Description, name: description, widget: text, hint: "One or two sentences describing the area's character." }
              - label: Lifestyle Highlights
                name: highlights
                widget: list
                field: { label: Highlight, name: highlight, widget: string }
                hint: "Short bullet points — 3 works well. Real, specific facts (schools, growth, commute) work better than generic praise."
              - label: Cover Photo
                name: cover_photo
                widget: image
                media_folder: "/images/neighborhoods"
                public_folder: "/images/neighborhoods"
                hint: "Wide/landscape photo works best (at least 800px wide)."
              - { label: Cover Photo Alt Text, name: cover_alt, widget: string, required: false, hint: "A short description for accessibility — read aloud by screen readers." }

  - name: testimonials
    label: Testimonials
    files:
      - label: Client Reviews
        name: testimonials
        file: content/testimonials.json
        description: Edit client quote cards.
        fields:
          - label: Testimonials
            name: testimonials
            label_singular: Testimonial
            widget: list
            summary: "{{fields.client_name}} — {{fields.location}}"
            fields:
              - { label: Quote, name: quote, widget: text, hint: "Use the client's own words. Always get their permission before posting." }
              - { label: Client Name, name: client_name, widget: string }
              - { label: Location Tag, name: location, widget: string, hint: "e.g. Bought in Cary, NC" }
              - { label: Avatar Initials, name: initials, widget: string, hint: "1–3 letters" }
              - { label: Star Rating, name: stars, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - label: "⏳ Pending Approval"
                name: "pending_approval"
                widget: "boolean"
                default: true
                hint: "Checked = hidden from the live site, waiting for Marsha's approval. Uncheck this box and save to publish it live."
              - { label: "Source GUID", name: "source_guid", widget: "hidden", required: false }

  - name: market_metrics
    label: Market Metrics
    files:
      - label: Site Statistics
        name: metrics
        file: content/market-metrics.json
        description: Hero trust bar, hero stats strip, and seller section metrics.
        fields:
          - label: Regional Facts
            name: area_facts
            label_singular: Fact
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: Value, name: value, widget: string, hint: "e.g. 1.26M+" }
              - { label: Label, name: label, widget: string, hint: "The short phrase shown under the value, e.g. \"Population Growth Since 2020\"." }

  - name: blog
    label: Blog & Market Insights
    files:
      - label: Blog Posts
        name: blog
        file: content/blog.json
        description: Publish market analysis, community events, and lifestyle articles.
        fields:
          - label: Posts
            name: posts
            label_singular: Post
            widget: list
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: Title, name: title, widget: string, hint: "Also generates the post's web address automatically — keep it clear and specific." }
              - { label: Publish Date, name: date, widget: datetime }
              - { label: Author, name: author, widget: string }
              - label: Category
                name: category
                widget: select
                options: ["Market Analysis", "Market Insights", "Community Events", "Relocation", "Luxury Lifestyle"]
                hint: "Controls which filter tab this post shows under on the blog."
              - label: Region
                name: region
                widget: select
                required: false
                options: ["Core Triangle", "Military & Sandhills", "Coastal & Beaches"]
                hint: "⚠️ This field is no longer used by the live site — safe to ignore."
              - { label: Excerpt, name: excerpt, widget: text, hint: "The short preview text shown on the blog card before someone clicks in." }
              - label: Cover Image
                name: cover_image
                widget: image
                media_folder: "images/blog"
                public_folder: "/images/blog"
                hint: "Wide/landscape photo works best (at least 800px wide)."
              - { label: Cover Alt Text, name: cover_alt, widget: string, required: false }
              - { label: Body, name: body, widget: markdown, hint: "The full article. Use ## for headers and - for bullet points." }
              - label: Draft
                name: draft
                widget: boolean
                default: false
                hint: "Weekly auto-generated posts arrive as drafts. Uncheck to publish on the live site."

  - name: faqs
    label: FAQs
    files:
      - label: Frequently Asked Questions
        name: faqs
        file: content/faqs.json
        description: Edit homepage FAQ accordion items.
        fields:
          - label: FAQs
            name: faqs
            label_singular: FAQ
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text, hint: "Keep it concise — a couple of sentences is usually enough." }

  - name: "properties"
    label: "Properties"
    files:
      - name: "properties"
        label: "Properties"
        file: "content/properties.json"
        fields:
          - name: "properties"
            label: "Properties"
            widget: "list"
            fields:
              - { label: "Address", name: "address", widget: "string" }
              - { label: "City, State ZIP", name: "city_state", widget: "string", hint: "e.g. Raleigh, NC 27601" }
              - { label: "Price", name: "price", widget: "number", value_type: "int", hint: "Numbers only — no $ sign or commas." }
              - { label: "Bedrooms", name: "beds", widget: "number" }
              - { label: "Bathrooms", name: "baths", widget: "number" }
              - { label: "Square Footage", name: "sqft", widget: "number" }
              - label: "Property Type"
                name: "type"
                widget: "select"
                options: ["residential", "commercial", "investment"]
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["active", "pending", "sold"]
                hint: "Update this as the listing moves through the process — visitors filter by this."
              - label: "Listing Agent"
                name: "agent"
                widget: "relation"
                collection: "agents"
                search_fields: ["name"]
                display_fields: ["name"]
                value_field: "name"
                hint: "Only add properties where you are personally the listing agent."
              - label: "Photos"
                name: "photos"
                widget: "list"
                field: { label: "Photo", name: "image", widget: "image" }
                min: 1
                max: 20
                hint: "Up to 20 photos. The first photo is used as the main thumbnail — pick your best exterior shot."
              - { label: "Description", name: "description", widget: "text" }
              - label: "⏳ Pending Approval"
                name: "pending_approval"
                widget: "boolean"
                default: true
                hint: "Checked = hidden from the live site, waiting for Marsha's approval. Uncheck this box and save to publish it live."

  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Events"
        file: "content/events.json"
        description: "Physical/QR-code event landing pages. An event stays hidden from the site until you check Active."
        fields:
          - name: "events"
            label: "Events"
            widget: "list"
            summary: "{{fields.active}} {{fields.name}} — {{fields.event_type}}"
            fields:
              - { label: "Event Name", name: "name", widget: "string", hint: "e.g. \"Fall Blessing Basket Drive\" — this also generates the event's web address." }
              - label: "Event Type"
                name: "event_type"
                widget: "select"
                hint: "Controls the visual style and tone of the event page."
                options:
                  - "Blessing Basket Drive"
                  - "Back to School Drive"
                  - "Neighborhood Cleanup / Give-Back Day"
                  - "Local Vendor / Small Business Market"
                  - "Homebuying Seminar"
                  - "First-Time Homebuyer Workshop"
                  - "Investment Property 101"
                  - "New Construction / Builder Tour"
                  - "Downsizing & Senior Transition Seminar"
                  - "Open House"
                  - "Party"
                  - "Client Appreciation"
                  - "VIP Client Appreciation"
                  - "Military Event"
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. \"10:00 AM – 2:00 PM\"" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. \"5300 Greens Dairy Road, Raleigh, NC\"" }
              - { label: "Description", name: "description", widget: "text", hint: "A few sentences about the event — shown on the event's own page." }
              - label: "Banner Photo"
                name: "banner"
                widget: "image"
                required: false
                media_folder: "/images/events"
                public_folder: "/images/events"
                hint: "Wide/landscape photo works best (at least 1000px wide)."
              - label: "Active"
                name: "active"
                widget: "boolean"
                default: false
                hint: "⚠️ Unchecked = hidden from the site entirely, even with a direct link. Check this when you're ready for people to actually see and register for this event."
              - label: "Registration Questions"
                name: "questions"
                widget: "list"
                required: false
                hint: "Beyond name/email/phone (always collected automatically), add any extra questions you want to ask registrants."
                summary: "{{fields.question_text}}"
                fields:
                  - label: "Quick-Pick from Common Questions (optional)"
                    name: "question_template"
                    widget: "select"
                    required: false
                    hint: "For reference only — copy the wording you like into the Question field below, or skip this and write your own."
                    options:
                      - "Are you currently working with a real estate agent?"
                      - "Would you like occasional updates on the local real estate market?"
                      - "How did you hear about this event?"
                      - "Are you currently looking to buy a home?"
                      - "What's your timeline to buy?"
                      - "Have you been pre-approved for a mortgage?"
                      - "Which area(s) are you most interested in?"
                      - "Is this your first time buying a home?"
                      - "Are you currently considering selling your home?"
                      - "What's your timeline to sell?"
                      - "Would you like a free home valuation?"
                      - "Are you PCSing to or from this area?"
                      - "What's your report date or move timeline?"
                      - "Are you familiar with your VA loan benefits?"
                      - "Are you interested in investment properties?"
                      - "What's your target investment budget?"
                      - "Will you be bringing guests? If so, how many?"
                      - "Do you have any dietary restrictions or allergies we should know about?"
                      - "Any questions you'd like us to address at the event?"
                      - "Would you like to be added to our email newsletter?"
                  - { label: "Question", name: "question_text", widget: "string" }
                  - label: "Answer Type"
                    name: "question_type"
                    widget: "select"
                    default: "short_text"
                    options:
                      - { label: "Short Text Answer", value: "short_text" }
                      - { label: "Yes / No", value: "yes_no" }
                      - { label: "Multiple Choice", value: "multiple_choice" }
                  - label: "Choices (only used for Multiple Choice)"
                    name: "choices"
                    widget: "list"
                    required: false
                    field: { label: "Choice", name: "choice", widget: "string" }
