<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration | Core Collective Real Estate</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0A192F;
  --navy-mid:#0D2244;
  --gold:#C5A059;
  --gold-lt:#D4AF37;
  --white:#FFFFFF;
  --off-white:#F7F5F0;
  --gray-100:#ECEAE5;
  --gray-500:#6B6963;
  --font-display:'Playfair Display',Georgia,serif;
  --font-sans:'Inter',system-ui,sans-serif;
  --trans:cubic-bezier(0.4,0,0.2,1);
}
html,body{min-height:100%}
body{font-family:var(--font-sans);background:var(--off-white);color:var(--navy);line-height:1.6}
img{display:block;max-width:100%}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none}
a{color:var(--gold)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold-lt);outline-offset:3px}

.page-state{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
.page-state p{max-width:420px;font-size:16px;font-weight:400;color:var(--gray-500);line-height:1.7}
.page-state a{display:inline-block;margin-top:20px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--navy);border-bottom:1px solid var(--gold);padding-bottom:4px}

.event-header{background:var(--navy);padding:72px 24px 64px;text-align:center}
.event-type{font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.event-title{font-family:var(--font-display);font-size:clamp(32px,5vw,56px);font-weight:400;color:var(--white);line-height:1.15;max-width:800px;margin:0 auto 18px}
.event-meta{font-size:14px;font-weight:300;color:rgba(255,255,255,.7);max-width:640px;margin:0 auto}

.event-body{padding:48px 24px 80px}
.event-banner{width:100%;max-width:960px;margin:0 auto 40px;aspect-ratio:16/7;object-fit:cover}
.event-description{max-width:640px;margin:0 auto 48px;font-size:16px;font-weight:400;color:var(--navy);line-height:1.75}

.reg-card{max-width:480px;margin:0 auto;background:var(--white);border:1px solid var(--gray-100);padding:36px 32px}
.reg-card h2{font-family:var(--font-display);font-size:26px;font-weight:400;margin-bottom:24px;text-align:center}
.form-field{margin-bottom:18px}
.form-label{display:block;font-size:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--navy);margin-bottom:8px}
.form-input{width:100%;padding:13px 16px;border:1px solid var(--gray-100);background:var(--off-white);font-family:var(--font-sans);font-size:13px;color:var(--navy);outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--gold)}
.yn-row,.choice-list{display:flex;flex-wrap:wrap;gap:10px}
.yn-btn,.choice-opt{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:1px solid var(--gray-100);background:var(--off-white);font-size:13px;color:var(--navy);transition:border-color .2s,background .2s}
.yn-btn.active,.choice-opt:has(input:checked){border-color:var(--gold);background:rgba(197,160,89,.12)}
.choice-opt input{margin-right:8px}
.form-submit{width:100%;padding:15px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;transition:background .2s var(--trans),transform .2s var(--trans)}
.form-submit:hover{background:var(--gold-lt);transform:translateY(-2px)}
.form-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.form-status{display:none;padding:14px 18px;margin-top:16px;font-size:12px;font-weight:500;text-align:center}
.form-status.error{display:block;background:rgba(192,57,43,.1);color:#922b21;border:1px solid rgba(192,57,43,.25)}
.confirm{text-align:center;padding:24px 8px}
.confirm p{font-family:var(--font-display);font-size:28px;font-weight:400;color:var(--navy);line-height:1.35}
</style>
</head>
<body>
<div id="app">
  <div class="page-state" id="state-loading">
    <p>Loading event…</p>
  </div>
</div>
<script>
function slugify(name){
  return String(name||'').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');
}

function escHtml(str){
  return String(str||'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function getSlug(){
  const path=window.location.pathname.replace(/\/+$/,'');
  const match=path.match(/\/event\/(.+)$/i);
  return match?decodeURIComponent(match[1]):'';
}

function eventDatePassed(dateStr){
  if(!dateStr)return false;
  const raw=String(dateStr).slice(0,10);
  const d=new Date(raw+'T00:00:00');
  if(Number.isNaN(d.getTime()))return false;
  const today=new Date();
  today.setHours(0,0,0,0);
  return d<today;
}

function formatDate(dateStr){
  if(!dateStr)return '';
  const d=new Date(String(dateStr).slice(0,10)+'T00:00:00');
  if(Number.isNaN(d.getTime()))return String(dateStr);
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

function getChoices(question){
  const list=Array.isArray(question.choices)?question.choices:[];
  return list.map(c=>typeof c==='string'?c:(c&&(c.choice||c.label||c.value))||'').filter(Boolean);
}

function renderUnavailable(){
  document.getElementById('app').innerHTML=`
    <div class="page-state">
      <div>
        <p>This event isn't currently available. Check back soon, or reach out to us directly.</p>
        <a href="/">Back to Core Collective</a>
      </div>
    </div>`;
}

function renderEvent(event){
  const meta=[formatDate(event.date),event.time,event.location].filter(Boolean).join(' · ');
  const questions=Array.isArray(event.questions)?event.questions:[];
  const banner=event.banner?`<img class="event-banner" src="${escHtml(event.banner)}" alt="">`:'';
  const extra=questions.map((q,i)=>{
    const label=q.question_text||q.question||('Question '+(i+1));
    const type=q.question_type||'short_text';
    if(type==='yes_no'){
      return `<div class="form-field">
        <span class="form-label">${escHtml(label)}</span>
        <div class="yn-row" data-q="${i}">
          <button type="button" class="yn-btn" data-value="Yes">Yes</button>
          <button type="button" class="yn-btn" data-value="No">No</button>
        </div>
      </div>`;
    }
    if(type==='multiple_choice'){
      const radios=getChoices(q).map((choice,ci)=>`
        <label class="choice-opt">
          <input type="radio" name="q-${i}" value="${escHtml(choice)}">
          <span>${escHtml(choice)}</span>
        </label>`).join('');
      return `<div class="form-field">
        <span class="form-label">${escHtml(label)}</span>
        <div class="choice-list">${radios}</div>
      </div>`;
    }
    return `<div class="form-field">
      <label class="form-label" for="q-${i}">${escHtml(label)}</label>
      <input class="form-input" id="q-${i}" name="q-${i}" type="text">
    </div>`;
  }).join('');

  document.title=event.name+' | Core Collective Real Estate';
  document.getElementById('app').innerHTML=`
    <header class="event-header">
      <div class="event-type">${escHtml(event.event_type||'Event')}</div>
      <h1 class="event-title">${escHtml(event.name)}</h1>
      <p class="event-meta">${escHtml(meta)}</p>
    </header>
    <main class="event-body">
      ${banner}
      ${event.description?`<p class="event-description">${escHtml(event.description)}</p>`:''}
      <div class="reg-card" id="reg-card">
        <h2>Register</h2>
        <form id="reg-form" novalidate>
          <div class="form-field">
            <label class="form-label" for="fullName">Full Name</label>
            <input class="form-input" id="fullName" name="fullName" type="text" required autocomplete="name">
          </div>
          <div class="form-field">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" id="email" name="email" type="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-input" id="phone" name="phone" type="tel" required autocomplete="tel">
          </div>
          ${extra}
          <button class="form-submit" id="reg-submit" type="submit">Register Now</button>
          <div class="form-status" id="reg-status" hidden></div>
        </form>
      </div>
    </main>`;

  document.querySelectorAll('.yn-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=btn.closest('.yn-row');
      row.querySelectorAll('.yn-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      row.dataset.value=btn.dataset.value;
    });
  });

  document.getElementById('reg-form').addEventListener('submit',e=>{
    e.preventDefault();
    submitRegistration(event,questions);
  });
}

function collectAnswers(questions){
  return questions.map((q,i)=>{
    const label=q.question_text||q.question||('Question '+(i+1));
    const type=q.question_type||'short_text';
    let answer='';
    if(type==='yes_no'){
      answer=document.querySelector(`.yn-row[data-q="${i}"]`)?.dataset.value||'';
    }else if(type==='multiple_choice'){
      const picked=document.querySelector(`input[name="q-${i}"]:checked`);
      answer=picked?picked.value:'';
    }else{
      answer=(document.getElementById('q-'+i)?.value||'').trim();
    }
    return {label,answer};
  });
}

async function submitRegistration(event,questions){
  const fullName=document.getElementById('fullName').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const status=document.getElementById('reg-status');
  const btn=document.getElementById('reg-submit');
  status.hidden=true;status.className='form-status';status.textContent='';

  if(!fullName){showError(status,'Please enter your full name.');document.getElementById('fullName').focus();return;}
  if(!email||!email.includes('@')){showError(status,'Please enter a valid email address.');document.getElementById('email').focus();return;}
  if(!phone){showError(status,'Please enter your phone number.');document.getElementById('phone').focus();return;}

  const pairs=collectAnswers(questions);
  const message=[event.name].concat(pairs.map(p=>p.label+': '+p.answer)).join('\n');
  const payload={
    source:`Event Registration: ${event.name}`,
    timestamp:new Date().toISOString(),
    lead:{fullName,email,phone,message}
  };

  btn.disabled=true;btn.textContent='Registering…';
  try{
    const res=await fetch('/.netlify/functions/submit-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('HTTP '+res.status);
    document.getElementById('reg-card').innerHTML=`<div class="confirm"><p>You're registered! We'll see you there.</p></div>`;
  }catch(err){
    showError(status,'There was a problem submitting your registration. Please try again or call us at (919) 324-5134.');
    btn.disabled=false;btn.textContent='Register Now';
  }
}

function showError(el,msg){
  el.hidden=false;
  el.className='form-status error';
  el.textContent=msg;
}

async function init(){
  const slug=getSlug();
  if(!slug){renderUnavailable();return;}
  try{
    const res=await fetch('/content/events.json');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const events=Array.isArray(data.events)?data.events:[];
    const event=events.find(e=>slugify(e&&e.name)===slug);
    if(!event||event.active!==true||eventDatePassed(event.date)){
      renderUnavailable();
      return;
    }
    renderEvent(event);
  }catch(err){
    renderUnavailable();
  }
}

init();
</script>
</body>
</html>
