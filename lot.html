<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-K2VZ5SGH5D"></script>

<title>Lot Sign | Core Collective Real Estate</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy-0:#0c1e33;
    --navy-1:#122c48;
    --navy-2:#1b3d61;
    --gold:#cda053;
    --gold-bright:#e6bd74;
    --cream:#faf5ea;
    --ink:#1d2a37;
    --ink-soft:#4b5a68;
    --rule:rgba(205,160,83,0.35);
    font-synthesis:none;
  }
  html,body{min-height:100%}
  body{
    background:var(--navy-0);
    color:var(--cream);
    font-family:'Archivo',ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    scroll-snap-type:y proximity;
  }
  h1,h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;text-wrap:balance;margin:0}
  img{display:block;max-width:100%}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}

  .page-state{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center;background:var(--cream);color:var(--ink)}
  .page-state p{max-width:420px;font-size:16px;line-height:1.7;color:var(--ink-soft)}
  .page-state a{display:inline-block;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--gold);padding-bottom:4px}

  .stage{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
  @media (min-width:560px){
    body{background:linear-gradient(180deg,#e9e2d2 0%,#ded5c1 100%)}
    .stage{box-shadow:0 30px 80px -20px rgba(12,30,51,.55),0 0 0 10px #16110b,0 0 0 12px rgba(0,0,0,.15);border-radius:34px;overflow:hidden;margin:40px auto;min-height:calc(100vh - 80px)}
  }

  .act-one{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vh 8vw 14vh;background:radial-gradient(120% 90% at 50% 8%,var(--navy-2) 0%,var(--navy-1) 46%,var(--navy-0) 100%);scroll-snap-align:start;overflow:hidden}
  .stars{position:absolute;inset:0;pointer-events:none}
  .stars span{position:absolute;width:3px;height:3px;background:var(--gold-bright);border-radius:50%;opacity:0;animation:twinkle 3.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}

  .scene-wrap{position:relative;width:100%;max-width:340px;margin-bottom:2.2vh;opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s forwards}
  .scene{width:100%;aspect-ratio:1/0.86;display:block}
  .lot-tag{position:absolute;right:2%;bottom:6%;background:var(--cream);color:var(--ink);font-weight:800;font-size:11px;letter-spacing:.06em;padding:6px 10px;border-radius:4px;transform:rotate(3deg);box-shadow:0 10px 18px -8px rgba(0,0,0,.45)}

  .house-group{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:house-appear 1.3s cubic-bezier(.25,.7,.2,1) 3.2s forwards}
  @keyframes house-appear{0%{opacity:0;transform:scale(.7) translateY(8px)}50%{opacity:.6;transform:scale(.94) translateY(3px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  .poof-cloud circle{--end-op:0.2;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.45);animation:poof-pulse 1.9s cubic-bezier(.3,.6,.3,1) forwards}
  .poof-cloud circle:nth-child(1){animation-delay:2.6s}.poof-cloud circle:nth-child(2){animation-delay:2.72s}.poof-cloud circle:nth-child(3){animation-delay:2.84s}.poof-cloud circle:nth-child(4){animation-delay:2.96s}
  @keyframes poof-pulse{0%{opacity:0;transform:scale(.45)}32%{opacity:var(--end-op);transform:scale(1)}68%{opacity:var(--end-op);transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}
  .sparkles{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6);animation:sparkle-pop 1.0s cubic-bezier(.3,1.2,.4,1) 2.6s forwards}
  @keyframes sparkle-pop{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.08)}70%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  .footprint{opacity:.85;animation:footprint-out .8s ease 3.2s forwards}
  .footprint-label{opacity:.75;animation:footprint-out .8s ease 3.2s forwards}
  @keyframes footprint-out{0%{opacity:.85}100%{opacity:0}}

  .headline{margin-top:20px;font-size:clamp(28px,8vw,38px);font-weight:600;line-height:1.14;color:var(--cream);opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) 4.7s forwards}
  .headline em{font-style:italic;color:var(--gold-bright)}
  .eyebrow{margin-top:18px;font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-bright);opacity:0;animation:rise .6s ease 5.05s forwards}
  .subline{margin-top:12px;font-size:16px;line-height:1.5;color:#c9d3dc;max-width:32ch;opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) 5.3s forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  .scroll-cue{position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:rise .7s ease 5.8s forwards,bob 2.2s ease-in-out 6.5s infinite}
  .scroll-cue span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9fb0bf}
  .scroll-cue svg{width:16px;height:16px;stroke:#9fb0bf}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

  .act-two{position:relative;min-height:100vh;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:11vh 9vw 8vh;text-align:center;scroll-snap-align:start}
  .act-two::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--rule) 20%,var(--rule) 80%,transparent)}
  .avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;background:linear-gradient(155deg,#173250,#0f2038);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--cream),0 0 0 5px var(--rule),0 18px 30px -14px rgba(29,42,55,.35);margin-bottom:22px}
  .avatar span{font-family:'Fraunces',serif;font-size:32px;font-weight:600;color:var(--gold-bright)}
  .kicker{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9a7a3d}
  .name{margin-top:10px;font-size:clamp(24px,6.4vw,29px);font-weight:600;color:var(--ink)}
  .role{margin-top:6px;font-size:14.5px;color:var(--ink-soft)}
  .role b{color:var(--ink);font-weight:700}
  .pitch{margin-top:22px;font-size:16px;line-height:1.6;color:var(--ink-soft);max-width:34ch}
  .ctas{margin-top:32px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;border-radius:11px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:transform .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--ink);color:var(--cream);box-shadow:0 10px 22px -10px rgba(29,42,55,.5)}
  .btn-secondary{background:transparent;color:var(--ink);border-color:#d8cdb6}
  .agent-row{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin-top:6px}
  .agent-name-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-top:10px}
  .agent-pair{display:flex;gap:10px;width:100%}
  .agent-pair .btn{flex:1;padding:12px 10px;font-size:13px}
  .fine{margin-top:26px;font-size:12px;color:#a99a7c;letter-spacing:.02em}

  @media (prefers-reduced-motion:reduce){
    .scene-wrap,.headline,.eyebrow,.subline,.scroll-cue,.stars span,.poof-cloud circle,.sparkles,.footprint,.footprint-label{animation:none!important;opacity:1!important;transform:none!important}
    .poof-cloud circle,.sparkles,.footprint,.footprint-label{opacity:0!important}
    .house-group{animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <div class="page-state" id="state-loading">
    <p>Loading…</p>
  </div>
</div>
<script>
function escHtml(str){
  return String(str||'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function getSlug(){
  const path=window.location.pathname.replace(/\/+$/,'');
  const match=path.match(/\/lot\/(.+)$/i);
  return match?decodeURIComponent(match[1]):'';
}

function mediaUrl(src){
  const s=String(src||'').trim();
  if(!s)return '';
  if(/^(https?:)?\/\//i.test(s)||s.startsWith('/'))return s;
  return '/'+s.replace(/^\.\//,'');
}

function firstName(name){
  return String(name||'').trim().split(/\s+/)[0]||'us';
}

function telHref(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  if(!digits)return '';
  if(digits.length===10)return 'tel:+1'+digits;
  if(digits.length===11&&digits.charAt(0)==='1')return 'tel:+'+digits;
  return 'tel:'+digits;
}
function smsHref(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  if(!digits)return '';
  if(digits.length===10)return 'sms:+1'+digits;
  if(digits.length===11&&digits.charAt(0)==='1')return 'sms:+'+digits;
  return 'sms:'+digits;
}

function renderUnavailable(){
  document.getElementById('app').innerHTML=`
    <div class="page-state">
      <div>
        <p>This sign isn't available right now. Head back to our homepage to reach the team.</p>
        <a href="/">Back to Core Collective</a>
      </div>
    </div>`;
}

function renderLotSign(sign,agents){
  const builder=String(sign.builder_name||'').trim();
  const lotLabel=String(sign.lot_label||'').trim();
  const logoSrc=mediaUrl(sign.builder_logo);
  const assignedIds=Array.isArray(sign.assigned_agents)?sign.assigned_agents:[];
  const assignedAgents=assignedIds
    .map(id=>agents.find(a=>String(a&&a.agent_id||'').toLowerCase()===String(id||'').toLowerCase()))
    .filter(Boolean);

  const kicker=assignedAgents.length===1
    ? `New Construction &middot; ${escHtml(builder||'Core Collective Real Estate')}`
    : `New Construction &middot; Core Collective Real Estate`;
  const nameLine=assignedAgents.length===1?escHtml(assignedAgents[0].name):(builder?escHtml(builder):'Core Collective Real Estate');
  const roleLine=assignedAgents.length===1
    ? `eXp Realty &middot; <b>${escHtml(assignedAgents[0].title||'Realtor')}</b>`
    : `eXp Realty &middot; <b>${assignedAgents.length>1?'ask any of us below':'whoever’s free helps first'}</b>`;

  const avatar=logoSrc
    ? `<img class="avatar" src="${escHtml(logoSrc)}" alt="${escHtml(builder)}">`
    : `<div class="avatar" aria-hidden="true"><span>${assignedAgents.length===1?escHtml((assignedAgents[0].initials||firstName(assignedAgents[0].name).charAt(0))):'CC'}</span></div>`;

  let ctasHtml='';
  if(assignedAgents.length===1){
    const a=assignedAgents[0];
    const phone=String(a.phone||'').trim();
    ctasHtml=phone?`<div class="ctas">
      <a class="btn btn-primary" href="${escHtml(telHref(phone))}">Call ${escHtml(firstName(a.name))}</a>
      <a class="btn btn-secondary" href="${escHtml(smsHref(phone))}">Text ${escHtml(firstName(a.name))}</a>
    </div>`:'';
  } else if(assignedAgents.length>1){
    const rows=assignedAgents.map(a=>{
      const phone=String(a.phone||'').trim();
      if(!phone)return '';
      return `<div class="agent-name-label">${escHtml(a.name)}</div>
        <div class="agent-pair">
          <a class="btn btn-primary" href="${escHtml(telHref(phone))}">Call</a>
          <a class="btn btn-secondary" href="${escHtml(smsHref(phone))}">Text</a>
        </div>`;
    }).join('');
    ctasHtml=`<div class="agent-row">${rows}</div>`;
  }

  const pitch=assignedAgents.length===1
    ? `Ask ${escHtml(firstName(assignedAgents[0].name))} about this lot — or any of the others ${builder?`on ${escHtml(builder)}'s`:'on this'} street.`
    : `Ask about this lot — or any of the others on this street. Whichever of us picks up first will walk you through building here.`;

  document.title='We make dream homes appear | Core Collective Real Estate';
  document.getElementById('app').innerHTML=`
  <div class="stage">
    <section class="act-one" aria-label="Sign scan opening">
      <div class="stars" aria-hidden="true">
        <span style="top:12%;left:18%;animation-delay:.2s;"></span>
        <span style="top:22%;left:78%;animation-delay:1.1s;"></span>
        <span style="top:8%;left:52%;animation-delay:1.9s;"></span>
        <span style="top:34%;left:10%;animation-delay:.7s;"></span>
        <span style="top:30%;left:88%;animation-delay:2.4s;"></span>
      </div>
      <div class="scene-wrap">
        <svg class="scene" viewBox="0 0 340 292" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an empty lot with a house appearing on it">
          <path d="M0 226 Q170 208 340 226 L340 292 L0 292 Z" fill="#0f2843"/>
          <path d="M0 226 Q170 208 340 226" stroke="#2b4d70" stroke-width="2" fill="none"/>
          <g class="house-group">
            <rect x="244" y="152" width="10" height="24" fill="#8a6a34"/>
            <polygon points="176,190 220,146 264,190" fill="#8a6a34"/>
            <rect x="184" y="190" width="72" height="38" rx="2" fill="var(--gold)"/>
            <rect x="232" y="198" width="15" height="15" fill="#0f2843" opacity="0.8"/>
            <rect x="209" y="210" width="17" height="18" fill="#0f2843"/>
          </g>
          <rect class="footprint" x="178" y="216" width="84" height="13" rx="2" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 7"/>
          <text class="footprint-label" x="220" y="248" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" letter-spacing="2" fill="#8fa4b8">LOT AVAILABLE</text>
          <g class="poof-cloud">
            <circle cx="205" cy="178" r="17" fill="#dbe1e8" style="--end-op:0.18"/>
            <circle cx="228" cy="166" r="24" fill="#dbe1e8" style="--end-op:0.24"/>
            <circle cx="252" cy="180" r="19" fill="#dbe1e8" style="--end-op:0.2"/>
            <circle cx="232" cy="196" r="15" fill="#dbe1e8" style="--end-op:0.16"/>
          </g>
          <g class="sparkles" stroke="var(--gold-bright)" stroke-width="2" stroke-linecap="round">
            <path d="M262 146 l8 8"/><path d="M270 146 l-8 8"/>
            <path d="M199 136 l7 7"/><path d="M206 136 l-7 7"/>
            <path d="M270 186 l6 6"/><path d="M276 186 l-6 6"/>
          </g>
        </svg>
        ${lotLabel?`<span class="lot-tag">${escHtml(lotLabel)}</span>`:''}
      </div>
      <h1 class="headline">We make dream homes <em>appear.</em></h1>
      <p class="eyebrow">Scanned from a sign on this lot</p>
      <p class="subline">Empty today. Somebody&rsquo;s dream home, one conversation away.</p>
      <div class="scroll-cue">
        <span>Keep going</span>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
      </div>
    </section>

    <section class="act-two" aria-label="Meet the agent">
      ${avatar}
      <p class="kicker">${kicker}</p>
      <h2 class="name">${nameLine}</h2>
      <p class="role">${roleLine}</p>
      <p class="pitch">${pitch}</p>
      ${ctasHtml}
      <p class="fine">Core Collective Real Estate &middot; eXp Realty</p>
    </section>
  </div>`;
}

async function init(){
  const slug=getSlug();
  if(!slug){renderUnavailable();return;}
  try{
    const [signsRes,agentsRes]=await Promise.all([
      fetch('/content/builder-signs.json'),
      fetch('/content/agents.json')
    ]);
    if(!signsRes.ok||!agentsRes.ok)throw new Error('HTTP error');
    const signsData=await signsRes.json();
    const agentsData=await agentsRes.json();
    const signs=Array.isArray(signsData.signs)?signsData.signs:[];
    const agents=Array.isArray(agentsData.agents)?agentsData.agents:[];
    const sign=signs.find(s=>String(s&&s.sign_id||'').toLowerCase()===slug.toLowerCase());
    if(!sign||sign.pending_approval===true){
      renderUnavailable();
      return;
    }
    renderLotSign(sign,agents);
  }catch(err){
    renderUnavailable();
  }
}

init();
</script>
</body>
</html>
